################################################################################
# Docker CD - Production Multi-Stage Build
# Builds all 4 layers in a single multi-stage Dockerfile
# Only uploads the final workspace image to Docker Hub
################################################################################
name: Docker CD - Production

on:
  push:
    branches:
      - main
      - production
      
    paths:
      - 'docker/**'
      - 'apps/supervisor/**'
      - '.github/workflows/docker-cd-production.yml'
  pull_request:
    branches:
      - main
      - production
    paths:
      - 'docker/**'
      - 'apps/supervisor/**'
      - '.github/workflows/docker-cd-production.yml'
  workflow_dispatch:
    inputs:
      push_to_dockerhub:
        description: 'Push to Docker Hub'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  DOCKERHUB_IMAGE: vaibhavsing/dev8-workspace
  DOCKER_BUILDKIT: 1

concurrency:
  group: docker-cd-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build Multi-Stage Docker Image
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          driver-opts: |
            image=moby/buildkit:latest
            network=host
      
      - name: Generate version
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="v$(date +%Y%m%d)-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"
      
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Dev8.dev Workspace
            org.opencontainers.image.description=Complete development workspace with VS Code Server and AI tools
            org.opencontainers.image.vendor=Dev8.dev
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      
      - name: Build multi-stage Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.production
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
      
      - name: Test final workspace image
        run: |
          echo "=== Testing Final Workspace Image ==="
          docker run --rm -e ENVIRONMENT_ID=ci-test ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.version }} bash -c "
            echo '--- Testing Workspace Supervisor ---' &&
            workspace-supervisor --version &&
            echo '--- Testing Node.js ---' &&
            node --version &&
            npm --version &&
            pnpm --version &&
            echo '--- Testing Python ---' &&
            python --version &&
            pip --version &&
            echo '--- Testing Go ---' &&
            go version &&
            echo '--- Testing Rust ---' &&
            rustc --version &&
            echo '--- Testing Bun ---' &&
            bun --version &&
            echo '--- Testing VS Code Server ---' &&
            code-server --version &&
            echo '--- Testing GitHub CLI ---' &&
            gh --version &&
            echo '--- Testing Azure CLI ---' &&
            az version &&
            echo '--- Testing yq ---' &&
            yq --version &&
            echo '' &&
            echo '=== All Tests Passed Successfully! ==='
          "
      
      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          timeout: '15m'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: docker-workspace-production
      
      - name: Image size and details
        run: |
          echo "=== Image Information ==="
          docker images | grep dev8-workspace
          echo ""
          SIZE=$(docker inspect ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.version }} --format='{{.Size}}')
          SIZE_HUMAN=$(echo $SIZE | numfmt --to=iec-i --suffix=B)
          echo "Image size: ${SIZE_HUMAN}"
          echo ""
          echo "Image labels:"
          docker inspect ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.version }} --format='{{json .Config.Labels}}' | jq
      
      - name: Push to Docker Hub
        if: |
          github.event_name != 'pull_request' && 
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production' ||
           (github.event_name == 'workflow_dispatch' && github.event.inputs.push_to_dockerhub == 'true'))
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
      
      - name: Deployment summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "# 🚀 Docker Production Deployment Summary"
            echo ""
            echo "## 📦 Deployment Information"
            echo "- **Version**: \`${{ steps.version.outputs.version }}\`"
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Branch**: \`${{ github.ref_name }}\`"
            echo "- **Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "## 🐳 Docker Hub Image"
            echo ""
            echo "**Image**: \`${{ env.DOCKERHUB_IMAGE }}\`"
            echo ""
            echo "### Pull Commands:"
            echo "\`\`\`bash"
            echo "# Latest version"
            echo "docker pull ${{ env.DOCKERHUB_IMAGE }}:latest"
            echo ""
            echo "# Specific version"
            echo "docker pull ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.version }}"
            echo "\`\`\`"
            echo ""
            echo "## 🏃 Run Commands"
            echo ""
            echo "\`\`\`bash"
            echo "# Run workspace container"
            echo "docker run -d \\"
            echo "  --name dev8-workspace \\"
            echo "  -p 8080:8080 \\"
            echo "  -p 2222:2222 \\"
            echo "  -p 9000:9000 \\"
            echo "  -e GITHUB_TOKEN=\${GITHUB_TOKEN} \\"
            echo "  -e ENVIRONMENT_ID=dev8-prod-001 \\"
            echo "  -v dev8-home:/home/dev8 \\"
            echo "  -v dev8-workspace:/workspace \\"
            echo "  ${{ env.DOCKERHUB_IMAGE }}:latest"
            echo "\`\`\`"
            echo ""
            echo "## 🧪 Test Results"
            echo ""
            echo "✅ All component tests passed:"
            echo "- Workspace Supervisor"
            echo "- Node.js (with npm, pnpm)"
            echo "- Python (with pip, poetry)"
            echo "- Go"
            echo "- Rust"
            echo "- Bun"
            echo "- VS Code Server"
            echo "- GitHub CLI"
            echo "- Azure CLI"
            echo "- yq"
            echo ""
            echo "## 🔐 Security Scan"
            echo ""
            echo "Trivy vulnerability scan completed. Check GitHub Security tab for detailed results."
            echo ""
            echo "## 📝 Local Development"
            echo ""
            echo "\`\`\`bash"
            echo "# Build all layers locally"
            echo "cd docker && make build-all"
            echo ""
            echo "# Run with docker-compose"
            echo "docker compose up -d"
            echo "\`\`\`"
            echo ""
            echo "---"
            echo "**Deployment completed at**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: Comment PR with image info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Docker Build Summary 🐳
            
            **Status**: ✅ Build successful (not pushed to Docker Hub)
            
            **Image**: \`${{ env.DOCKERHUB_IMAGE }}\`
            **Version**: \`${{ steps.version.outputs.version }}\`
            
            **Build Type**: Multi-stage (all 4 layers)
            - Stage 1: Workspace Supervisor (Go binary)
            - Stage 2: Base System (Ubuntu + SSH + tools)
            - Stage 3: Language Runtimes (Node.js, Python, Go, Rust, Bun)
            - Stage 4: VS Code Server
            - Stage 5: AI Tools (GitHub CLI, Azure CLI, yq) - **Final Image**
            
            **Note**: Only the final workspace image is pushed to Docker Hub (when merged to \`main\` or \`production\` branch).
            
            ### Local Development
            \`\`\`bash
            # Build all layers locally
            cd docker && make build-all
            
            # Run with docker-compose
            docker compose up -d
            
            # Access VS Code Server
            open http://localhost:8080
            \`\`\`
            
            ### Test Results
            ✅ All component tests passed
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

