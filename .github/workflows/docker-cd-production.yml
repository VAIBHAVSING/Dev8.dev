################################################################################
# Docker CD - Production Layered Build
# Builds all 4 layers separately (base → languages → vscode → ai-tools)
# Only uploads the final workspace container to Docker Hub
################################################################################
name: Docker CD - Production

on:
  push:
    branches:
      - main
      - production
    paths:
      - 'docker/**'
      - 'apps/supervisor/**'
      - '.github/workflows/docker-cd-production.yml'
  pull_request:
    branches:
      - main
      - production
    paths:
      - 'docker/**'
      - 'apps/supervisor/**'
      - '.github/workflows/docker-cd-production.yml'
  workflow_dispatch:
    inputs:
      push_to_dockerhub:
        description: 'Push to Docker Hub'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  DOCKERHUB_IMAGE: vaibhavsing/dev8-workspace
  DOCKER_BUILDKIT: 1

concurrency:
  group: docker-cd-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build Layered Docker Images
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Generate version
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="v$(date +%Y%m%d)-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"
      
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build all Docker layers
        run: |
          echo "🏗️ Building all Docker layers (base → languages → vscode → ai-tools)..."
          
          # Build Layer 1: Base
          echo "Building base layer..."
          docker build -t dev8-base:latest -f ./docker/images/00-base/Dockerfile .
          
          # Build Layer 2: Languages
          echo "Building languages layer..."
          docker build -t dev8-languages:latest -f ./docker/images/10-languages/Dockerfile .
          
          # Build Layer 3: VS Code
          echo "Building vscode layer..."
          docker build -t dev8-vscode:latest -f ./docker/images/20-vscode/Dockerfile .
          
          # Build Layer 4: Workspace (Final)
          echo "Building workspace layer..."
          docker build -t dev8-workspace:latest -f ./docker/images/30-ai-tools/Dockerfile .
          
          echo "✅ All layers built successfully!"
      
      - name: Tag final workspace image for Docker Hub
        run: |
          echo "🏷️ Tagging final workspace image..."
          docker tag dev8-workspace:latest ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.version }}
          docker tag dev8-workspace:latest ${{ env.DOCKERHUB_IMAGE }}:latest
          if [ "${{ github.ref }}" = "refs/heads/production" ]; then
            docker tag dev8-workspace:latest ${{ env.DOCKERHUB_IMAGE }}:production
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker tag dev8-workspace:latest ${{ env.DOCKERHUB_IMAGE }}:pr-${{ github.event.pull_request.number }}
          fi
          echo "✅ Images tagged"
      
      - name: Test final workspace container
        run: |
          echo "=== Testing Final Workspace Container ==="
          docker run --rm dev8-workspace:latest bash -c "
            echo '--- Testing Workspace Supervisor ---' &&
            workspace-supervisor --version &&
            echo '--- Testing Node.js ---' &&
            node --version &&
            npm --version &&
            pnpm --version &&
            echo '--- Testing Python ---' &&
            python --version &&
            pip --version &&
            echo '--- Testing Go ---' &&
            go version &&
            echo '--- Testing Rust ---' &&
            rustc --version &&
            echo '--- Testing Bun ---' &&
            bun --version &&
            echo '--- Testing VS Code Server ---' &&
            code-server --version &&
            echo '--- Testing GitHub CLI ---' &&
            gh --version &&
            echo '--- Testing Azure CLI ---' &&
            az version &&
            echo '--- Testing yq ---' &&
            yq --version &&
            echo '' &&
            echo '=== All Tests Passed Successfully! ==='
          "
      
      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dev8-workspace:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          timeout: '15m'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: docker-workspace-production
      
      - name: Image size and details
        run: |
          echo "=== Final Workspace Container Information ==="
          docker images | grep -E "(dev8-base|dev8-languages|dev8-vscode|dev8-workspace)"
          echo ""
          echo "Final workspace size:"
          SIZE=$(docker inspect dev8-workspace:latest --format='{{.Size}}')
          SIZE_HUMAN=$(echo $SIZE | numfmt --to=iec-i --suffix=B)
          echo "  ${SIZE_HUMAN}"
          echo ""
          echo "Docker Hub tags:"
          docker images | grep "${{ env.DOCKERHUB_IMAGE }}"
      
      - name: Push final workspace container to Docker Hub
        if: |
          github.event_name != 'pull_request' && 
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production' ||
           (github.event_name == 'workflow_dispatch' && github.event.inputs.push_to_dockerhub == 'true'))
        run: |
          echo "🚀 Pushing final workspace container to Docker Hub..."
          docker push ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.version }}
          docker push ${{ env.DOCKERHUB_IMAGE }}:latest
          if [ "${{ github.ref }}" = "refs/heads/production" ]; then
            docker push ${{ env.DOCKERHUB_IMAGE }}:production
          fi
          echo "✅ Container pushed successfully to Docker Hub!"
          echo ""
          echo "Images available:"
          echo "  - ${{ env.DOCKERHUB_IMAGE }}:latest"
          echo "  - ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.version }}"
      
      - name: Deployment summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "# 🚀 Docker Production Deployment Summary"
            echo ""
            echo "## 📦 Deployment Information"
            echo "- **Version**: \`${{ steps.version.outputs.version }}\`"
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Branch**: \`${{ github.ref_name }}\`"
            echo "- **Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "## 🏗️ Build Approach"
            echo ""
            echo "Built using **layered Docker images**:"
            echo "1. � dev8-base (Ubuntu + SSH + Supervisor)"
            echo "2. 🔹 dev8-languages (Node.js, Python, Go, Rust, Bun)"
            echo "3. 🔹 dev8-vscode (VS Code Server)"
            echo "4. 🔹 **dev8-workspace** (AI Tools - Final Container)"
            echo ""
            echo "## �🐳 Docker Hub - Final Container Only"
            echo ""
            echo "**Image**: \`${{ env.DOCKERHUB_IMAGE }}\`"
            echo ""
            echo "### Pull Commands:"
            echo "\`\`\`bash"
            echo "# Latest version"
            echo "docker pull ${{ env.DOCKERHUB_IMAGE }}:latest"
            echo ""
            echo "# Specific version"
            echo "docker pull ${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.version }}"
            echo "\`\`\`"
            echo ""
            echo "## 🏃 Run Container (Production)"
            echo ""
            echo "\`\`\`bash"
            echo "# Run workspace container with volume support"
            echo "docker run -d \\"
            echo "  --name dev8-workspace \\"
            echo "  -p 8080:8080 \\"
            echo "  -p 2222:2222 \\"
            echo "  -p 9000:9000 \\"
            echo "  -e GITHUB_TOKEN=\${GITHUB_TOKEN} \\"
            echo "  -e ENVIRONMENT_ID=dev8-prod-001 \\"
            echo "  -v dev8-home:/home/dev8 \\"
            echo "  -v dev8-workspace:/workspace \\"
            echo "  ${{ env.DOCKERHUB_IMAGE }}:latest"
            echo "\`\`\`"
            echo ""
            echo "## 🧪 Test Results"
            echo ""
            echo "✅ All component tests passed:"
            echo "- Workspace Supervisor"
            echo "- Node.js (with npm, pnpm)"
            echo "- Python (with pip, poetry)"
            echo "- Go"
            echo "- Rust"
            echo "- Bun"
            echo "- VS Code Server"
            echo "- GitHub CLI"
            echo "- Azure CLI"
            echo "- yq"
            echo ""
            echo "## 🔐 Security Scan"
            echo ""
            echo "Trivy vulnerability scan completed. Check GitHub Security tab for detailed results."
            echo ""
            echo "## 📝 Local Development"
            echo ""
            echo "\`\`\`bash"
            echo "# Build all layers locally"
            echo "cd docker && make build-all"
            echo ""
            echo "# Run with docker-compose"
            echo "docker compose up -d"
            echo "\`\`\`"
            echo ""
            echo "---"
            echo "**Deployment completed at**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: Comment PR with container info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Docker Build Summary 🐳
            
            **Status**: ✅ Build successful (not pushed to Docker Hub)
            
            **Build Approach**: Layered Docker Images
            - 🔹 Layer 1: \`dev8-base\` (Ubuntu + SSH + Supervisor)
            - 🔹 Layer 2: \`dev8-languages\` (Node.js, Python, Go, Rust, Bun)
            - 🔹 Layer 3: \`dev8-vscode\` (VS Code Server)
            - 🔹 Layer 4: \`dev8-workspace\` (**Final Container** - AI Tools)
            
            **Final Container**: \`vaibhavsing/dev8-workspace\`
            
            **Note**: Only the final \`dev8-workspace\` container is pushed to Docker Hub (when merged to \`main\` or \`production\` branch).
            
            ### Local Development
            \`\`\`bash
            # Build all layers locally
            cd docker && make build-all
            
            # Run with docker-compose
            docker compose up -d
            
            # Access VS Code Server
            open http://localhost:8080
            \`\`\`
            
            ### Production Deployment (After Merge)
            \`\`\`bash
            # Pull from Docker Hub
            docker pull vaibhavsing/dev8-workspace:latest
            
            # Run with volume support (for ACI deployment)
            docker run -d \\
              --name dev8-workspace \\
              -p 8080:8080 -p 2222:2222 -p 9000:9000 \\
              -e GITHUB_TOKEN=\${GITHUB_TOKEN} \\
              -v dev8-home:/home/dev8 \\
              -v dev8-workspace:/workspace \\
              vaibhavsing/dev8-workspace:latest
            \`\`\`
            
            ### Test Results
            ✅ All component tests passed
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

