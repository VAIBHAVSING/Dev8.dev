name: Docker Images CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-images.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-images.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_base:
        description: 'Build base image'
        required: false
        default: 'true'
      build_mvp:
        description: 'Build MVP image (Node.js + Python + Go)'
        required: false
        default: 'true'

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Determine what to build
  setup:
    runs-on: ubuntu-latest
    outputs:
      build_base: ${{ steps.check.outputs.build_base }}
      build_mvp: ${{ steps.check.outputs.build_mvp }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine what to build
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build_base=${{ github.event.inputs.build_base }}" >> $GITHUB_OUTPUT
            echo "build_mvp=${{ github.event.inputs.build_mvp }}" >> $GITHUB_OUTPUT
          else
            # Check which files changed
            if git diff --name-only HEAD^ HEAD | grep -q "docker/base/"; then
              echo "build_base=true" >> $GITHUB_OUTPUT
              # If base changes, rebuild MVP image
              echo "build_mvp=true" >> $GITHUB_OUTPUT
            else
              echo "build_base=false" >> $GITHUB_OUTPUT
              echo "build_mvp=$(git diff --name-only HEAD^ HEAD | grep -q "docker/mvp/" && echo true || echo false)" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

  # Build and test base image
  build-base:
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.build_base == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-base-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-base-

      - name: Build base image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/base
          file: ./docker/base/Dockerfile
          push: false
          load: true
          tags: dev8-base:${{ needs.setup.outputs.version }},dev8-base:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Test base image
        run: |
          docker run --rm -e GITHUB_TOKEN=test_token dev8-base:latest echo "Base image works!"

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dev8-base:${{ needs.setup.outputs.version }}
          format: 'sarif'
          output: 'trivy-base-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-base-results.sarif'
          category: docker-base

      - name: Export image
        run: |
          docker save dev8-base:${{ needs.setup.outputs.version }} | gzip > dev8-base.tar.gz

      - name: Upload base image artifact
        uses: actions/upload-artifact@v3
        with:
          name: dev8-base-image
          path: dev8-base.tar.gz
          retention-days: 7

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # Build and test MVP image
  build-mvp:
    runs-on: ubuntu-latest
    needs: [setup, build-base]
    if: |
      always() &&
      (needs.build-base.result == 'success' || needs.build-base.result == 'skipped') &&
      needs.setup.outputs.build_mvp == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download base image
        if: needs.build-base.result == 'success'
        uses: actions/download-artifact@v3
        with:
          name: dev8-base-image

      - name: Load base image
        if: needs.build-base.result == 'success'
        run: |
          docker load < dev8-base.tar.gz

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-mvp-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-mvp-

      - name: Build MVP image
        uses: docker/build-push-action@v5
        with:
          context: ./docker/mvp
          file: ./docker/mvp/Dockerfile
          push: false
          load: true
          tags: dev8-mvp:${{ needs.setup.outputs.version }},dev8-mvp:latest
          build-args: |
            BASE_IMAGE=dev8-base:${{ needs.setup.outputs.version }}
            VERSION=${{ needs.setup.outputs.version }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Test MVP image
        run: |
          docker run --rm dev8-mvp:latest node --version
          docker run --rm dev8-mvp:latest python --version
          docker run --rm dev8-mvp:latest go version
          docker run --rm dev8-mvp:latest code-server --version
          docker run --rm dev8-mvp:latest aws --version
          docker run --rm dev8-mvp:latest /home/dev8/.backup-scripts/backup.sh --help || echo "Backup script exists"

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dev8-mvp:${{ needs.setup.outputs.version }}
          format: 'sarif'
          output: 'trivy-mvp-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-mvp-results.sarif'
          category: docker-mvp

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # Generate build summary
  summary:
    runs-on: ubuntu-latest
    needs: [setup, build-base, build-mvp]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# Docker Images Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| dev8-base | ${{ needs.build-base.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| dev8-mvp | ${{ needs.build-mvp.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Version" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ needs.setup.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
